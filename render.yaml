# render.yaml
services:
  - type: web
    name: erp-company-site
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
      - key: OPENAI_API_KEY
      - key: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: erp-company-site.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://erp-company-site.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
